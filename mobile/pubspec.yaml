name: grosirun
description: Grosirun — Belanja Patungan Super Ringan. Platform group-buying RT/RW.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── State Management & Architecture ───
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.3              # Dependency Injection / Service Locator

  # ─── Networking ───
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0   # Pretty-print Dio requests/responses
  dio_cache_interceptor: ^3.5.1  # HTTP cache layer for Dio
  dio_cache_interceptor_hive_store: ^3.2.2  # Hive store for Dio cache

  # ─── Routing & Navigation ───
  go_router: ^14.6.2          # Declarative routing with deep links

  # ─── Local Storage ───
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4  # Simple key-value storage
  path_provider: ^2.1.5       # File system paths

  # ─── UI & Design ───
  google_fonts: ^6.2.1        # Beautiful typography (Nunito, Poppins)
  flex_color_scheme: ^7.3.1   # Advanced theming engine
  flutter_animate: ^4.5.0     # Easy, performant animations
  flutter_svg: ^2.0.16        # SVG rendering support
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  gap: ^3.0.1                 # Clean spacing widget
  flutter_staggered_grid_view: ^0.7.0  # Staggered grid layouts
  flutter_slidable: ^3.1.1    # Swipeable list items
  smooth_page_indicator: ^1.2.0+3  # Page indicator dots
  dotted_border: ^2.1.0       # Dotted borders for upload areas
  badges: ^3.1.2              # Notification badges
  card_swiper: ^3.0.1         # Card swiper/carousel
  dropdown_button2: ^2.3.9    # Enhanced dropdown buttons
  fluttertoast: ^8.2.10       # Toast notifications
  flutter_spinkit: ^5.2.1     # Loading spinners
  percent_indicator: ^4.2.3   # Circular/linear progress
  pin_code_fields: ^8.0.1     # Beautiful OTP/PIN input
  sticky_headers: ^0.3.0+2    # Sticky list headers

  # ─── Charts & Visualization ───
  fl_chart: ^0.69.2           # Beautiful charts & graphs

  # ─── Forms & Validation ───
  # flutter_form_builder: ^9.5.0        # Form builder widgets
  # form_builder_validators: ^11.0.0    # Built-in validators

  # ─── Image & Media ───
  image_picker: ^1.1.2        # Pick images from gallery/camera
  flutter_image_compress: ^2.3.0  # Compress images before upload
  image_cropper: ^8.0.2       # Crop images
  file_picker: ^8.1.4         # Pick any file type

  # ─── Sharing & Communication ───
  share_plus: ^10.1.2         # Share content (WhatsApp, etc)
  url_launcher: ^6.3.1

  # ─── Device & Platform Info ───
  device_info_plus: ^11.1.1   # Device hardware info
  package_info_plus: ^8.1.1   # App version, build number
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.2  # Better connectivity check
  permission_handler: ^11.3.1  # Runtime permissions

  # ─── Date & Time ───
  intl: ^0.20.2
  timeago: ^3.7.0             # "2 minutes ago" formatting

  # ─── Utilities ───
  uuid: ^4.5.1
  logger: ^2.4.0              # Beautiful logging
  collection: ^1.18.0         # Enhanced collections
  async: ^2.11.0              # Async utilities
  retry: ^3.1.2               # Automatic retry logic

  # ─── PDF & Documents ───
  pdf: ^3.11.1                # PDF generation (recap reports)
  printing: ^5.13.3           # Print & share PDFs
  open_filex: ^4.5.0          # Open files with system apps

  # ─── Analytics & Monitoring ───
  sentry_flutter: ^8.9.0      # Error tracking & performance

  # ─── Localization ───
  easy_localization: ^3.0.7   # Easy i18n (ID/EN support)

  # ─── Responsive Design ───
  sizer: ^3.0.0               # Responsive sizing

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ─── Code Quality & Linting ───
  very_good_analysis: ^6.0.0  # Strict lint rules (from Very Good Ventures)

  # ─── Testing ───
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # ─── Code Generation ───
  build_runner: ^2.4.13       # Code generation runner
  json_serializable: ^6.8.0   # JSON serialization codegen
  hive_generator: ^2.0.1      # Hive adapter codegen
  flutter_launcher_icons: ^0.14.1  # Auto-generate app icons
  flutter_native_splash: ^2.4.3    # Auto-generate splash screen

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/lottie/

# ─── App Icon Generation ───
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

# ─── Splash Screen ───
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/splash_logo.png"
    icon_background_color: "#FFFFFF"
