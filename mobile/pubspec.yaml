name: grosirun
description: Grosirun — Belanja Patungan Super Ringan. Platform group-buying RT/RW.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Network
  dio: ^5.7.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1

  # UI
  shimmer: ^3.0.0
  lottie: ^3.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/lottie/
  # Uncomment di atas setelah menambahkan file asset nyata
