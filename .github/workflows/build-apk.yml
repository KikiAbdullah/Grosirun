name: Build APK + Firebase Distribution Canary

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK split-per-abi + obfuscate + SENTRY_DSN
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./build/debug-info --dart-define=API_BASE_URL=https://api.grosirun.id/api/v1 --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          ls -lh build/app/outputs/apk/release/*.apk

      - name: Build AAB for Play Store
        working-directory: mobile
        run: flutter build appbundle --release --obfuscate --split-debug-info=./build/debug-info --dart-define=API_BASE_URL=https://api.grosirun.id/api/v1 --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Check size <10MB
        working-directory: mobile
        run: |
          SIZE=$(stat -c%s build/app/outputs/apk/release/app-arm64-v8a-release.apk)
          MAX=10485760
          if [ $SIZE -gt $MAX ]; then echo "APK too large $SIZE > $MAX"; exit 1; fi

      - name: Upload artifact APK arm64
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: mobile/build/app/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload artifact AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Firebase App Distribution Canary 10%
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: pilot-canary
          file: mobile/build/app/outputs/apk/release/app-arm64-v8a-release.apk
          releaseNotes: "Canary 10% - ${{ github.ref_name }} - ${{ github.sha }}"

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
