# docker-compose.yml - Grosirun V3.1 Enterprise GAP Closed
# Fix GAP Kritis #1 Docker/Local Environment Script

version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grosirun_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage/logs:/var/www/html/storage/logs
    networks:
      - grosirun
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=grosirun
      - DB_USERNAME=grosirun
      - DB_PASSWORD=secret
      - DB_CONNECTION=mysql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - FILESYSTEM_DISK=public
      - APP_ENV=local
      - APP_DEBUG=true
    ports:
      - "8000:9000"
    command: sh -c "php artisan serve --host=0.0.0.0 --port=9000"

  nginx:
    image: nginx:1.24-alpine
    container_name: grosirun_nginx
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - app
    networks:
      - grosirun

  mysql:
    image: mysql:8.0
    container_name: grosirun_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: grosirun
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: grosirun
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - grosirun
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: grosirun_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - grosirun
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grosirun_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
    networks:
      - grosirun

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grosirun_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    networks:
      - grosirun

  # Optional MinIO S3 compatible for dev S3 primary test
  minio:
    image: minio/minio:latest
    container_name: grosirun_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - grosirun
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  grosirun:
    driver: bridge
